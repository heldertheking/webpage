<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect x="0.5" y="0.5" width="31" height="31" rx="6" fill="#ffffff" stroke="#e2e8f0"/>

  <g fill="none" stroke-linejoin="round">
    <!-- diagonal connectors, outer corner to inner corner -->
    <g stroke="#94a3b8" stroke-width="1">
      <path d="M6 6 L12 12"/>
      <path d="M26 6 L20 12"/>
      <path d="M26 26 L20 20"/>
      <path d="M6 26 L12 20"/>
    </g>

    <!-- outer cube face -->
    <path d="M6 6 L26 6 L26 26 L6 26 Z" stroke="#0f172a" stroke-width="1.6"/>

    <!-- inner cube face -->
    <path d="M12 12 L20 12 L20 20 L12 20 Z" stroke="#2563eb" stroke-width="1.5"/>
  </g>

  <g fill="#0f172a">
    <circle cx="6" cy="6" r="1"/>
    <circle cx="26" cy="6" r="1"/>
    <circle cx="26" cy="26" r="1"/>
    <circle cx="6" cy="26" r="1"/>
  </g>
  <g fill="#2563eb">
    <circle cx="12" cy="12" r="0.9"/>
    <circle cx="20" cy="12" r="0.9"/>
    <circle cx="20" cy="20" r="0.9"/>
    <circle cx="12" cy="20" r="0.9"/>
  </g>
</svg>
