<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="neonGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="0.9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="32" height="32" rx="6" fill="#0b0f19"/>
  <circle cx="16" cy="16" r="7" fill="url(#coreGlow)"/>

  <g fill="none" stroke-linejoin="round" filter="url(#neonGlow)">
    <!-- diagonal connectors, outer corner to inner corner -->
    <g stroke="#67e8f9" stroke-width="1" stroke-opacity="0.85">
      <path d="M6 6 L12 12"/>
      <path d="M26 6 L20 12"/>
      <path d="M26 26 L20 20"/>
      <path d="M6 26 L12 20"/>
    </g>

    <!-- outer cube face -->
    <path d="M6 6 L26 6 L26 26 L6 26 Z" stroke="#22d3ee" stroke-width="1.7"/>

    <!-- inner cube face -->
    <path d="M12 12 L20 12 L20 20 L12 20 Z" stroke="#e879f9" stroke-width="1.5"/>
  </g>

  <g filter="url(#neonGlow)">
    <circle cx="6" cy="6" r="1.1" fill="#22d3ee"/>
    <circle cx="26" cy="6" r="1.1" fill="#22d3ee"/>
    <circle cx="26" cy="26" r="1.1" fill="#22d3ee"/>
    <circle cx="6" cy="26" r="1.1" fill="#22d3ee"/>
    <circle cx="12" cy="12" r="1" fill="#e879f9"/>
    <circle cx="20" cy="12" r="1" fill="#e879f9"/>
    <circle cx="20" cy="20" r="1" fill="#e879f9"/>
    <circle cx="12" cy="20" r="1" fill="#e879f9"/>
  </g>
</svg>
