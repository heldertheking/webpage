<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="neonGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="0.9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="32" height="32" rx="6" fill="#0b0f19"/>
  <circle cx="16" cy="16" r="8" fill="url(#coreGlow)"/>

  <g fill="none" stroke-linejoin="round" filter="url(#neonGlow)">
    <!-- twisted connectors between the two differently-rotated cube faces -->
    <g stroke="#67e8f9" stroke-width="1" stroke-opacity="0.85">
      <path d="M23.3 26.43 L22.96 17.23"/>
      <path d="M5.57 23.3 L14.77 22.96"/>
      <path d="M8.7 5.57 L9.04 14.77"/>
      <path d="M26.43 8.7 L17.23 9.04"/>
    </g>

    <!-- outer face, tilted -->
    <path d="M23.3 26.43 L5.57 23.3 L8.7 5.57 L26.43 8.7 Z" stroke="#22d3ee" stroke-width="1.7"/>

    <!-- inner face, counter-rotated for the "turned" effect -->
    <path d="M22.96 17.23 L14.77 22.96 L9.04 14.77 L17.23 9.04 Z" stroke="#e879f9" stroke-width="1.5"/>
  </g>

  <g filter="url(#neonGlow)">
    <circle cx="23.3" cy="26.43" r="1.1" fill="#22d3ee"/>
    <circle cx="5.57" cy="23.3" r="1.1" fill="#22d3ee"/>
    <circle cx="8.7" cy="5.57" r="1.1" fill="#22d3ee"/>
    <circle cx="26.43" cy="8.7" r="1.1" fill="#22d3ee"/>
    <circle cx="22.96" cy="17.23" r="1" fill="#e879f9"/>
    <circle cx="14.77" cy="22.96" r="1" fill="#e879f9"/>
    <circle cx="9.04" cy="14.77" r="1" fill="#e879f9"/>
    <circle cx="17.23" cy="9.04" r="1" fill="#e879f9"/>
  </g>
</svg>
